services:
  scheduler:
    build: .
    image: osu-api-scheduler:latest
    restart: unless-stopped
    # Published on localhost by default. The proxy endpoint is protected by
    # SCHEDULER_TOKEN, but there is no reason to expose it further than the
    # consumers actually need.
    ports:
      - "127.0.0.1:7654:7654"
    volumes:
      - scheduler-data:/data
    environment:
      # Required: the shared password consumers present to use the scheduler.
      SCHEDULER_TOKEN: "${SCHEDULER_TOKEN:?set SCHEDULER_TOKEN in .env}"
      # Dashboard sign-in. Register an osu! OAuth app whose callback is
      # <DASHBOARD_ORIGIN>/auth/callback.
      DASHBOARD_ORIGIN: "${DASHBOARD_ORIGIN:-http://localhost:7654}"
      DASHBOARD_OSU_CLIENT_ID: "${DASHBOARD_OSU_CLIENT_ID:-}"
      DASHBOARD_OSU_CLIENT_SECRET: "${DASHBOARD_OSU_CLIENT_SECRET:-}"
      DASHBOARD_ALLOWED_OSU_IDS: "${DASHBOARD_ALLOWED_OSU_IDS:-}"
      # Rate model. Defaults match osu!'s documented 60/min average, 1200 burst.
      SCHEDULER_PACE_SECONDS: "${SCHEDULER_PACE_SECONDS:-1.0}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7654/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s

volumes:
  scheduler-data:
